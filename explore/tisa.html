<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A sample photograph carousel for Ithaca College’s Tech Innovation Summer Academy (TISA).">
  <title>TISA | ICCS · Ithaca College</title>
  <link rel="stylesheet" href="../assets/style.css">

<link rel="stylesheet" href="../assets/accessibility.css"><link rel="stylesheet" href="../assets/times-sitewide.css">
<style>
/* Standalone TISA sample carousel; replace placeholder photos later. */
.tisa-gallery{padding:22px 0 34px}
.tisa-gallery h2{font:500 clamp(32px,4vw,46px)/1.2 var(--serif);margin:0 0 10px}
.tisa-gallery p{margin:0 0 16px}
.tisa-carousel{max-width:850px}
.tisa-carousel figure{margin:0}
.tisa-carousel figure[hidden]{display:none}
.tisa-carousel img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#e5f0ea}
.tisa-carousel figcaption{font-size:14px;margin-top:8px}
.tisa-carousel-controls{display:flex;align-items:center;gap:16px;margin-top:12px}
.tisa-carousel-controls button{background:#d9ead3;border:1px solid #899a83;border-radius:2px;color:#000;padding:7px 14px;font:inherit;cursor:pointer}
.tisa-carousel-controls button:hover{background:#c9dfc1}
.tisa-carousel-controls button:focus-visible{outline:3px solid #19564f;outline-offset:3px}
.tisa-carousel-status{font-size:14px}
</style>
</head>
<body><a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header"><div class="wrap"><nav class="nav" aria-label="Main navigation"><a href="../index.html">Home</a><a href="../index.html#majors">Majors</a><a href="../index.html#minors">Minors</a><a href="../index.html#micro-credentials">Micro-credentials</a><a href="../index.html#faculty">Faculty</a><a href="../index.html#other">Other</a></nav></div></header>
<main id="main-content" tabindex="-1">
<section class="inner-hero"><div class="wrap"><h1 class="page-title">Tech Innovation Summer Academy (TISA)</h1></div></section>
<section class="wrap tisa-gallery" aria-labelledby="tisa-gallery-heading">
<h2 id="tisa-gallery-heading">TISA in Pictures</h2>
<p>This is a sample photo carousel using seashells. Individual TISA photographs will replace these placeholders.</p>
<div class="tisa-carousel" aria-label="Photo carousel prototype">
<figure><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Conch_shell.jpg?width=960" alt="A conch shell on a beach" loading="eager"><figcaption>Sample photograph: <a href="https://commons.wikimedia.org/wiki/File:Conch_shell.jpg" target="_blank" rel="noopener">Conch shell (Wikimedia Commons)</a></figcaption></figure>
<figure hidden><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Scallop_Shell.png?width=960" alt="A scallop shell on beach sand" loading="lazy"><figcaption>Sample photograph: <a href="https://commons.wikimedia.org/wiki/File:Scallop_Shell.png" target="_blank" rel="noopener">Scallop shell (Wikimedia Commons)</a></figcaption></figure>
<figure hidden><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Seashells_on_the_sea_shore.jpg?width=960" alt="Seashells on the shore" loading="lazy"><figcaption>Sample photograph: <a href="https://commons.wikimedia.org/wiki/File:Seashells_on_the_sea_shore.jpg" target="_blank" rel="noopener">Seashells on the sea shore (Wikimedia Commons)</a></figcaption></figure>
<div class="tisa-carousel-controls"><button type="button" class="tisa-prev">Previous</button><span class="tisa-carousel-status" role="status" aria-live="polite">1 of 3</span><button type="button" class="tisa-next">Next</button></div>
</div></section>
</main>
<script>
(() => {
  const carousel = document.querySelector('.tisa-carousel');
  const slides = Array.from(carousel.querySelectorAll('figure'));
  const status = carousel.querySelector('.tisa-carousel-status');
  let index = 0;
  function show(next) {
    index = (next + slides.length) % slides.length;
    slides.forEach((slide, i) => { slide.hidden = i !== index; });
    status.textContent = (index + 1) + ' of ' + slides.length;
  }
  carousel.querySelector('.tisa-prev').addEventListener('click', () => show(index - 1));
  carousel.querySelector('.tisa-next').addEventListener('click', () => show(index + 1));
})();
</script>

</body>
</html>
